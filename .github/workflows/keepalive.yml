name: Keep backend warm

# Render's free tier sleeps the backend after ~15 min idle, which makes the
# first request slow ("server is waking up"). This pings the health endpoint
# on a schedule so the server stays awake and logins are instant.

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        run: |
          echo "Pinging https://syntrixlabs.in/api/health"
          curl -s -m 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://syntrixlabs.in/api/health || echo "ping failed (server may be cold) — ok"
